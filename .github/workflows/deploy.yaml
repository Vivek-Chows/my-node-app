name: CI/CD Pipeline - Deploy to ECS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: ap-south-2
  ECR_REPOSITORY: my-node-app
  ECS_SERVICE: my-node-app-service
  ECS_CLUSTER: my-ecs-cluster
  ECS_TASK_DEFINITION: my-node-app-task
  CONTAINER_NAME: my-node-app

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
      - run: npm ci
      - run: npm test
      - run: npm run test:coverage

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image-tag: ${{ steps.build.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsECSRole
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Build & Push
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image-tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to ECS (Native Blue/Green)
    runs-on: ubuntu-latest
    needs: build-and-push
    outputs:
      deployment-status: ${{ steps.wait-deployment.outputs.status }}
    steps:
      - uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsECSRole
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: Register new task definition
        id: register-task
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          # Get current task definition
          aws ecs describe-task-definition \
            --task-definition $ECS_TASK_DEFINITION \
            --region $AWS_REGION \
            --query taskDefinition > task-definition.json
          
          # Update image in task definition
          jq --arg IMAGE "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" '
            (.containerDefinitions[] | select(.name=="my-node-app").image) = $IMAGE
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )
          ' task-definition.json > task-definition-updated.json
          
          # Register new task definition
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-updated.json \
            --region $AWS_REGION \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          echo "NEW_TASK_DEF_ARN=$NEW_TASK_DEF_ARN" >> $GITHUB_ENV
          echo "new-task-def-arn=$NEW_TASK_DEF_ARN" >> $GITHUB_OUTPUT
      
      - name: Update ECS Service (Native Deployment)
        id: update-service
        env:
          NEW_TASK_DEF_ARN: ${{ steps.register-task.outputs.new-task-def-arn }}
        run: |
          echo "Updating ECS service with new task definition: $NEW_TASK_DEF_ARN"
          
          # Update service with new task definition
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --task-definition $NEW_TASK_DEF_ARN \
            --force-new-deployment \
            --region $AWS_REGION
          
          echo "Deployment initiated successfully"
      
      - name: Wait for deployment to complete
        id: wait-deployment
        run: |
          echo "Waiting for ECS deployment to complete..."
          
          # Get the latest deployment ID
          DEPLOYMENT_ID=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --region $AWS_REGION \
            --query 'services[0].deployments[?status==`PRIMARY`].id' \
            --output text)
          
          echo "Deployment ID: $DEPLOYMENT_ID"
          
          # Wait for deployment to complete
          MAX_RETRIES=60
          COUNT=0
          
          while [ $COUNT -lt $MAX_RETRIES ]; do
            # Check deployment status
            DEPLOYMENT_STATUS=$(aws ecs describe-services \
              --cluster $ECS_CLUSTER \
              --services $ECS_SERVICE \
              --region $AWS_REGION \
              --query 'services[0].deployments[?id==`'$DEPLOYMENT_ID'`].status' \
              --output text)
            
            # Check if all tasks are running
            RUNNING_COUNT=$(aws ecs describe-services \
              --cluster $ECS_CLUSTER \
              --services $ECS_SERVICE \
              --region $AWS_REGION \
              --query 'services[0].runningCount' \
              --output text)
            
            DESIRED_COUNT=$(aws ecs describe-services \
              --cluster $ECS_CLUSTER \
              --services $ECS_SERVICE \
              --region $AWS_REGION \
              --query 'services[0].desiredCount' \
              --output text)
            
            echo "Status: $DEPLOYMENT_STATUS, Running: $RUNNING_COUNT/$DESIRED_COUNT"
            
            if [ "$DEPLOYMENT_STATUS" == "PRIMARY" ] && [ "$RUNNING_COUNT" == "$DESIRED_COUNT" ]; then
              echo "✅ Deployment completed successfully!"
              echo "status=success" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            # Check for failed deployment
            FAILED_TASKS=$(aws ecs list-tasks \
              --cluster $ECS_CLUSTER \
              --service-name $ECS_SERVICE \
              --desired-status STOPPED \
              --region $AWS_REGION \
              --query 'taskArns' \
              --output text)
            
            if [ -n "$FAILED_TASKS" ]; then
              echo "⚠️ Some tasks failed. Checking exit codes..."
              for TASK_ARN in $FAILED_TASKS; do
                EXIT_CODE=$(aws ecs describe-tasks \
                  --cluster $ECS_CLUSTER \
                  --tasks $TASK_ARN \
                  --region $AWS_REGION \
                  --query 'tasks[0].containers[0].exitCode' \
                  --output text)
                if [ "$EXIT_CODE" != "0" ] && [ "$EXIT_CODE" != "null" ]; then
                  echo "❌ Task $TASK_ARN failed with exit code: $EXIT_CODE"
                fi
              done
            fi
            
            COUNT=$((COUNT + 1))
            sleep 10
          done
          
          echo "❌ Deployment timed out after $MAX_RETRIES attempts"
          echo "status=failed" >> $GITHUB_OUTPUT
          exit 1
      
      - name: Verify application health
        if: steps.wait-deployment.outputs.status == 'success'
        run: |
          echo "Verifying application health..."
          
          # Get ALB DNS name
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names ecs-alb \
            --region $AWS_REGION \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          
          echo "ALB DNS: $ALB_DNS"
          
          # Test health endpoint
          for i in {1..12}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://$ALB_DNS/health)
            if [ $HTTP_CODE -eq 200 ]; then
              echo "✅ Application health check passed!"
              exit 0
            fi
            echo "Attempt $i/12: Health check returned HTTP $HTTP_CODE, waiting..."
            sleep 10
          done
          
          echo "❌ Health check failed after 12 attempts"
          exit 1

  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [test, build-and-push, deploy]
    if: always()
    steps:
      - name: Determine status
        id: status
        run: |
          DEPLOY_STATUS="${{ needs.deploy.outputs.deployment-status }}"
          TEST_STATUS="${{ needs.test.result }}"
          
          if [ "$DEPLOY_STATUS" == "success" ] && [ "$TEST_STATUS" == "success" ]; then
            echo "status=✅ Deployment Successful" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
          else
            echo "status=❌ Deployment Failed" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          fi
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsECSRole
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Send SNS notification
        env:
          TOPIC_ARN: arn:aws:sns:${{ env.AWS_REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:deployment-notifications
          MESSAGE: |
            🚀 Deployment Status: ${{ steps.status.outputs.status }}
            
            📊 Details:
            - Repository: ${{ github.repository }}
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}
            - Actor: ${{ github.actor }}
            
            📈 Job Status:
            - Tests: ${{ needs.test.result }}
            - Build & Push: ${{ needs.build-and-push.result }}
            - Deployment: ${{ needs.deploy.result }}
            
            🔗 View deployment: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Check if SNS topic exists
          if aws sns get-topic-attributes --topic-arn $TOPIC_ARN --region $AWS_REGION 2>/dev/null; then
            aws sns publish \
              --topic-arn $TOPIC_ARN \
              --message "$MESSAGE" \
              --region $AWS_REGION
            echo "✅ SNS notification sent"
          else
            echo "⚠️ SNS topic not found. Skipping notification."
            echo "Create SNS topic: $TOPIC_ARN"
          fi
